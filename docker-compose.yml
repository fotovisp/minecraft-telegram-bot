services:
  bot:
    image: ghcr.io/fotovisp/minecraft-telegram-bot:latest
    container_name: mc_bot
    restart: always
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "8.8.8.8"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    env_file:
      - .env
    volumes:
      - ~/.ssh:/root/.ssh:ro

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 120 --cleanup
